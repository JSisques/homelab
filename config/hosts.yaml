hosts:
  proxmox:
    type: server
    platform: proxmox
    address: TBD  # LAN IP not confirmed yet
    role:
      - hypervisor

  nas:
    type: physical
    platform: nas
    address: 192.168.0.111
    role:
      - storage

  monitoring:
    type: lxc
    platform: proxmox
    address: 192.168.1.20
    cpu: 2
    memory: 2560
    # OS + Docker images + retained Prometheus/Loki data (~15GB at
    # typical retention settings, see prometheus.yml/config.yml).
    disk: 20
    role:
      - prometheus
      - grafana
      - loki
      - alertmanager

  homepage:
    type: lxc
    platform: proxmox
    address: 192.168.1.21
    cpu: 1
    memory: 256
    disk: 4
    role:
      - homepage

  uptime-kuma:
    type: lxc
    platform: proxmox
    address: 192.168.1.22
    cpu: 1
    memory: 512
    disk: 4
    role:
      - uptime-kuma

  it-tools:
    type: lxc
    platform: proxmox
    address: 192.168.1.23
    cpu: 1
    memory: 256
    disk: 4
    role:
      - it-tools

  n8n:
    type: lxc
    platform: proxmox
    address: 192.168.1.24
    cpu: 2
    memory: 2560
    disk: 16
    role:
      - n8n

  obsidian:
    type: lxc
    platform: proxmox
    address: 192.168.1.29
    cpu: 1
    # Headless Chromium alone needs ~1GB of /dev/shm (see compose.yaml),
    # so this can't be trimmed as far as the other LXCs.
    memory: 2048
    disk: 8
    role:
      - obsidian

  jellyfin:
    type: lxc
    platform: proxmox
    address: 192.168.1.32
    # Not in use yet. Direct play barely needs any CPU; bump this (or pass
    # through the iGPU for hardware transcoding) if software transcoding
    # becomes the common case.
    cpu: 2
    memory: 1536
    disk: 10
    role:
      - jellyfin

  cloudflared:
    type: lxc
    platform: proxmox
    address: 192.168.1.25
    cpu: 1
    memory: 128
    disk: 4
    role:
      - cloudflared

  adguard-home:
    type: lxc
    platform: proxmox
    address: 192.168.1.26
    cpu: 1
    memory: 256
    disk: 4
    role:
      - adguard-home

  traefik:
    type: lxc
    platform: proxmox
    address: 192.168.1.28
    cpu: 1
    memory: 256
    disk: 4
    role:
      - traefik

  wireguard:
    type: lxc
    platform: proxmox
    address: 192.168.1.27
    cpu: 1
    memory: 256
    disk: 4
    role:
      - wireguard

  pbs:
    type: vm
    platform: proxmox
    address: 192.168.1.30
    cpu: 2
    # Was undersized, not oversized: PBS wants ~4GB baseline for its
    # dedup chunk index, even with under 1TB of backup data.
    memory: 4096
    disk: 32
    role:
      - pbs

  k3s-server:
    type: vm
    platform: proxmox
    address: 192.168.1.31
    # Runs real pods today (no worker nodes yet), so this keeps headroom
    # above pure control-plane sizing. Revisit once raspberrypi-01/02 join
    # as workers and take workload off this node.
    cpu: 2
    memory: 3072
    disk: 30
    role:
      - k3s
      - server

  raspberrypi-01:
    type: physical
    platform: raspberry-pi
    address: 192.168.1.40
    role:
      - k3s
      - worker

  raspberrypi-02:
    type: physical
    platform: raspberry-pi
    address: 192.168.1.41
    role:
      - k3s
      - worker
