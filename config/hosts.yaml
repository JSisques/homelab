# `network` is the single source of truth for anything subnet-shaped —
# change a prefix/gateway/bridge here and every generated file (Terraform
# vars, Ansible inventory, Traefik routes, Prometheus/blackbox targets,
# WireGuard's ALLOWEDIPS/PEERDNS) picks it up on the next `make generate`.
# See config/README.md for the full resolution rules.
#
# Proxmox VMID for type: lxc / type: vm defaults to `octet` (it-tools
# octet 214 → CT 214 at 192.168.0.214). Set `vmid:` only when they must
# differ — Terraform always passes a pinned vm_id, never "next free ID".
network:
  lan:
    prefix: "192.168.0"
    mask: 24
    gateway: "192.168.0.1"
    bridge: "vmbr0"
  nas:
    prefix: "192.168.0"

hosts:
  proxmox:
    type: server
    platform: proxmox
    # Proxmox API node_name (hostname). VMs used to default to "pve" in the
    # generator and ignore terraform.tfvars — this is the SSOT for both LXC
    # and VM node_name.
    node: proxmox
    octet: 157
    role:
      - hypervisor

  nas:
    type: physical
    platform: nas
    network: nas
    octet: 111
    role:
      - storage

  monitoring:
    type: lxc
    platform: proxmox
    octet: 209
    cpu: 2
    # Bumped from 2560 to fit the OTel Collector + Tempo alongside
    # Prometheus/Grafana/Loki/Alertmanager on the same LXC.
    memory: 3584
    # OS + Docker images + retained Prometheus/Loki data (~15GB at
    # typical retention settings, see prometheus.yml/config.yml) + Tempo
    # trace storage (48h retention, services/tempo/tempo.yaml).
    disk: 24
    role:
      - prometheus
      - grafana
      - loki
      - alertmanager
      - otel-collector
      - tempo

  homepage:
    type: lxc
    platform: proxmox
    octet: 205
    cpu: 1
    memory: 256
    disk: 4
    role:
      - homepage

  uptime-kuma:
    type: lxc
    platform: proxmox
    octet: 210
    cpu: 1
    memory: 512
    disk: 4
    role:
      - uptime-kuma

  it-tools:
    type: lxc
    platform: proxmox
    octet: 214
    cpu: 1
    memory: 256
    disk: 4
    role:
      - it-tools

  n8n:
    type: lxc
    platform: proxmox
    octet: 211
    cpu: 2
    memory: 2560
    disk: 16
    role:
      - n8n

  obsidian:
    type: lxc
    platform: proxmox
    octet: 213
    cpu: 1
    # Headless Chromium alone needs ~1GB of /dev/shm (see compose.yaml),
    # so this can't be trimmed as far as the other LXCs.
    memory: 2048
    disk: 8
    role:
      - obsidian

  jellyfin:
    type: lxc
    platform: proxmox
    octet: 215
    # Not in use yet. Direct play barely needs any CPU; bump this (or pass
    # through the iGPU for hardware transcoding) if software transcoding
    # becomes the common case.
    cpu: 2
    memory: 1536
    disk: 10
    role:
      - jellyfin

  downloads:
    type: lxc
    platform: proxmox
    octet: 216
    # gluetun + qBittorrent (torrents, routed through VPN) + Prowlarr +
    # Sonarr/Radarr (indexing/organizing into Jellyfin's library) + pyLoad
    # (direct HTTP/FTP links) + MeTube (yt-dlp web UI). All app state is
    # local; actual downloaded files live on the NAS (see
    # services/downloads/README.md).
    cpu: 4
    memory: 4096
    disk: 24
    role:
      - qbittorrent
      - prowlarr
      - sonarr
      - radarr
      - pyload
      - metube

  cloudflared:
    type: lxc
    platform: proxmox
    octet: 200
    cpu: 1
    memory: 128
    disk: 4
    role:
      - cloudflared

  adguard-home-1:
    type: lxc
    platform: proxmox
    octet: 201
    cpu: 1
    memory: 256
    disk: 4
    role:
      - adguard-home-1

  adguard-home-2:
    type: lxc
    platform: proxmox
    # Independent secondary DNS resolver, on its own LXC, so LAN clients
    # get real redundancy (primary = adguard-home-1, secondary =
    # adguard-home-2) instead of a single point of failure for DNS.
    # Kept in sync from adguard-home-1 by the adguard-home-sync role
    # (see ansible/roles/adguard-home-sync/) rather than sharing state.
    octet: 202
    cpu: 1
    memory: 256
    disk: 4
    role:
      - adguard-home-2

  traefik:
    type: lxc
    platform: proxmox
    octet: 204
    cpu: 1
    memory: 256
    disk: 4
    role:
      - traefik

  wireguard:
    type: lxc
    platform: proxmox
    octet: 203
    cpu: 1
    memory: 256
    disk: 4
    role:
      - wireguard

  pbs:
    type: vm
    platform: proxmox
    octet: 206
    cpu: 2
    # Was undersized, not oversized: PBS wants ~4GB baseline for its
    # dedup chunk index, even with under 1TB of backup data.
    memory: 4096
    disk: 32
    role:
      - pbs

  k3s-server:
    type: vm
    platform: proxmox
    octet: 207
    # Runs real pods today (no worker nodes yet), so this keeps headroom
    # above pure control-plane sizing. Revisit once raspberrypi-01/02 join
    # as workers and take workload off this node.
    #
    # Bumped from 2/3072/30 to fit Rancher's management server (Helm
    # chart via Argo CD, see kubernetes/argocd/applications/rancher.yaml)
    # alongside Argo CD and the existing workloads — Rancher alone wants
    # ~2GB+ of headroom on top of what was already a tight single node.
    #
    # sisqueslabs-landing/daysoff/rancher carry no LXC/VM of their own —
    # they're Kubernetes workloads (see kubernetes/applications/ and
    # kubernetes/argocd/applications/), deployed via Argo CD, not
    # Ansible. These roles exist only so generate-blackbox.sh /
    # generate-traefik.sh can resolve a LAN address for their
    # config/services.yaml target (this node's NodePort), same trick as
    # grafana/prometheus/loki/alertmanager sharing the "monitoring" host
    # below.
    cpu: 4
    memory: 6144
    disk: 40
    role:
      - k3s
      - server
      - sisqueslabs-landing
      - daysoff
      - rancher
      - blog

  cookidoo-mcp:
    type: lxc
    platform: proxmox
    octet: 212
    # Single Node/NestJS container, no database — same profile as it-tools.
    cpu: 1
    memory: 512
    disk: 4
    role:
      - cookidoo-mcp

  rustfs:
    type: lxc
    platform: proxmox
    octet: 208
    # S3-compatible object storage (https://rustfs.com/, see
    # services/rustfs/README.md). Object data lives on the NAS over NFS
    # (ansible/roles/rustfs/), not on this LXC's own disk — disk here
    # only needs to hold the OS and the container image.
    cpu: 2
    memory: 1024
    disk: 8
    role:
      - rustfs

  raspberrypi-01:
    type: physical
    platform: raspberry-pi
    octet: 40
    role:
      - k3s
      - worker

  raspberrypi-02:
    type: physical
    platform: raspberry-pi
    octet: 41
    role:
      - k3s
      - worker
