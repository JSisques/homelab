      enabled: true
      description: PaperMC (arranca al conectar, duerme tras 10 min)

    uptime:
      enabled: true

    # lazymc (services/minecraft/) keeps this port listening even while
    # the actual Paper server is asleep, so a plain TCP connect is the
    # right up/down check — it reflects "can a player join at all",
    # not whether the heavy server process happens to be awake right now.
    blackbox:
      enabled: true
      port: 25565
      module: tcp_connect

    # dirien/minecraft-exporter (services/minecraft/), RCON-based, no
    # in-game plugin needed. Only reachable while the Paper server is
    # actually awake — up=0 while lazymc has it asleep is expected, not
    # a fault. See services/minecraft/README.md.
    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://192.168.0.217:9150/metrics

