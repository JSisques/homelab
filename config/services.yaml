services:
  proxmox:
    name: Proxmox
    category: Infrastructure
    tier: internal
    url: https://proxmox.home.arpa
    icon: proxmox.png

    homepage:
      enabled: true
      description: Virtualization platform

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://prometheus-pve-exporter:9221/pve

  grafana:
    name: Grafana
    category: Monitoring
    tier: internal
    url: https://grafana.home.arpa
    icon: grafana.png

    homepage:
      enabled: true
      description: Monitoring dashboards

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://grafana:3000/metrics

  prometheus:
    name: Prometheus
    category: Monitoring
    tier: internal
    url: https://prometheus.home.arpa
    icon: prometheus.png

    homepage:
      enabled: true
      description: Metrics and monitoring

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://prometheus:9090/metrics

  kafka:
    name: Kafka
    category: Infrastructure
    tier: internal
    url: https://kafka.home.arpa
    icon: kafka.png

    homepage:
      enabled: true
      description: Event streaming platform

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://kafka-exporter:9308/metrics

  uptime-kuma:
    name: Uptime Kuma
    category: Monitoring
    tier: internal
    url: https://uptime.home.arpa
    icon: uptime-kuma.png

    homepage:
      enabled: true
      description: Service monitoring

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://uptime-kuma:3001/metrics

  homepage:
    name: Homepage
    category: Infrastructure
    tier: internal
    url: https://home.home.arpa
    icon: homepage.png

    homepage:
      enabled: false  # Homepage does not need to link to itself
      description: Central dashboard for homelab services

    uptime:
      enabled: true

  adguard-home:
    name: AdGuard Home
    category: Networking
    tier: internal
    url: https://adguard.home.arpa
    icon: adguard-home.png

    homepage:
      enabled: true
      description: DNS and network-wide ad blocking

    uptime:
      enabled: true

  traefik:
    name: Traefik
    category: Networking
    tier: internal
    url: https://traefik.home.arpa
    icon: traefik.png

    homepage:
      enabled: true
      description: Internal reverse proxy for *.home.arpa

    uptime:
      enabled: true

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://192.168.1.28:8082/metrics

  gardenia:
    name: Gardenia
    category: Applications
    tier: public  # deployed on Kubernetes, exposed via Cloudflare Tunnel
    url: https://gardenia.sisqueslabs.com
    icon: mdi-sprout

    homepage:
      enabled: true
      description: Garden management platform

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://gardenia:3000/metrics

  it-tools:
    name: IT-Tools
    category: Utilities
    tier: internal
    url: https://it-tools.home.arpa
    icon: it-tools.png

    homepage:
      enabled: true
      description: Collection of useful developer tools

    uptime:
      enabled: true

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://it-tools-exporter:8080/metrics

  n8n:
    name: n8n
    category: Automation
    tier: internal  # exposed only via VPN/reverse proxy, see services/n8n
    url: https://n8n.home.arpa
    icon: n8n.png

    homepage:
      enabled: true
      description: Workflow automation platform

    uptime:
      enabled: true

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://n8n-exporter:8080/metrics
