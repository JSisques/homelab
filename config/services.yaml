services:

  proxmox:
    name: Proxmox
    category: Infrastructure
    url: https://proxmox.home.arpa
    icon: proxmox.png

    homepage:
      enabled: true
      description: Virtualization platform

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://prometheus-pve-exporter:9221/pve

  grafana:
    name: Grafana
    category: Monitoring
    url: https://grafana.home.arpa
    icon: grafana.png

    homepage:
      enabled: true
      description: Monitoring dashboards

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://grafana:3000/metrics

  prometheus:
    name: Prometheus
    category: Monitoring
    url: https://prometheus.home.arpa
    icon: prometheus.png

    homepage:
      enabled: true
      description: Metrics and monitoring

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://prometheus:9090/metrics

  kafka:
    name: Kafka
    category: Infrastructure
    url: https://kafka.home.arpa
    icon: kafka.png

    homepage:
      enabled: true
      description: Event streaming platform

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://kafka-exporter:9308/metrics

  uptime-kuma:
    name: Uptime Kuma
    category: Monitoring
    url: https://uptime.home.arpa
    icon: uptime-kuma.png

    homepage:
      enabled: true
      description: Service monitoring

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://uptime-kuma:3001/metrics

  gardenia:
    name: Gardenia
    category: Applications
    url: https://gardenia.home.arpa
    icon: mdi-sprout

    homepage:
      enabled: true
      description: Garden management platform

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://gardenia:3000/metrics
  
  it-tools:
    name: IT-Tools
    category: Utilities
    url: https://it-tools.home.arpa
    icon: it-tools.png

    homepage:
      enabled: true
      description: Collection of useful developer tools

    uptime:
      enabled: true

    monitoring:
      enabled: true
      type: prometheus
      target: it-tools-exporter:8080
      path: /metrics
