services:
  proxmox:
    name: Proxmox
    category: Infrastructure
    tier: internal
    url: https://proxmox.home.arpa
    icon: proxmox.png

    homepage:
      enabled: true
      description: Virtualization platform

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://prometheus-pve-exporter:9221/pve

  grafana:
    name: Grafana
    category: Monitoring
    tier: internal
    url: https://grafana.home.arpa
    icon: grafana.png

    homepage:
      enabled: true
      description: Monitoring dashboards

    traefik:
      enabled: true
      port: 3000

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://grafana:3000/metrics

  prometheus:
    name: Prometheus
    category: Monitoring
    tier: internal
    url: https://prometheus.home.arpa
    icon: prometheus.png

    homepage:
      enabled: true
      description: Metrics and monitoring

    traefik:
      enabled: true
      port: 9090

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://prometheus:9090/metrics

  loki:
    name: Loki
    category: Monitoring
    tier: internal

    homepage:
      enabled: false  # no standalone UI, browsed through Grafana

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://loki:3100/metrics

  alertmanager:
    name: Alertmanager
    category: Monitoring
    tier: internal

    homepage:
      enabled: false  # not routed through Traefik yet, no *.home.arpa URL

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://alertmanager:9093/metrics

  cloudflared:
    name: Cloudflared
    category: Networking
    tier: internal

    homepage:
      enabled: false  # background tunnel daemon, no web UI

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://192.168.1.25:20241/metrics

  kafka:
    name: Kafka
    category: Infrastructure
    tier: internal
    url: https://kafka.home.arpa
    icon: kafka.png

    homepage:
      enabled: true
      description: Event streaming platform

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://kafka-exporter:9308/metrics

  uptime-kuma:
    name: Uptime Kuma
    category: Monitoring
    tier: internal
    url: https://uptime.home.arpa
    icon: uptime-kuma.png

    homepage:
      enabled: true
      description: Service monitoring

    traefik:
      enabled: true
      port: 3001

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://uptime-kuma:3001/metrics

  homepage:
    name: Homepage
    category: Infrastructure
    tier: internal
    url: https://home.home.arpa
    icon: homepage.png

    homepage:
      enabled: false  # Homepage does not need to link to itself
      description: Central dashboard for homelab services

    traefik:
      enabled: true
      port: 3000

    uptime:
      enabled: true

    # No native /metrics — Homepage is a static dashboard. Probed by
    # blackbox_exporter instead, see services/blackbox-exporter/README.md.
    blackbox:
      enabled: true
      port: 3000
      scheme: http
      module: http_2xx

  adguard-home:
    name: AdGuard Home
    category: Networking
    tier: internal
    url: https://adguard.home.arpa
    icon: adguard-home.png

    homepage:
      enabled: true
      description: DNS and network-wide ad blocking

    traefik:
      enabled: true
      port: 3000

    uptime:
      enabled: true

    # No native /metrics — AdGuard Home has no Prometheus support. Probed
    # by blackbox_exporter instead, see services/blackbox-exporter/README.md.
    blackbox:
      enabled: true
      port: 3000
      scheme: http
      module: http_2xx

  traefik:
    name: Traefik
    category: Networking
    tier: internal
    url: https://traefik.home.arpa
    icon: traefik.png

    homepage:
      enabled: true
      description: Internal reverse proxy for *.home.arpa

    uptime:
      enabled: true

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://192.168.1.28:8082/metrics

  gardenia:
    name: Gardenia
    category: Applications
    tier: public  # deployed on Kubernetes, exposed via Cloudflare Tunnel
    url: https://gardenia.sisqueslabs.com
    icon: mdi-sprout

    homepage:
      enabled: true
      description: Garden management platform

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://gardenia:3000/metrics

  portfolio-web:
    name: Portfolio
    category: Applications
    # Static Astro site (source: github.com/JSisques/portfolio-web), served
    # from its own LXC via Traefik on the LAN and via Cloudflare Tunnel at
    # portfolio.jsisques.net for public access, same pattern as jellyfin.
    tier: internal
    url: https://portfolio-web.home.arpa
    icon: mdi-account-box

    homepage:
      enabled: true
      description: Personal developer portfolio

    traefik:
      enabled: true
      port: 8080

    uptime:
      enabled: true

    # No native /metrics — static site with no backend. Probed by
    # blackbox_exporter instead, see services/blackbox-exporter/README.md.
    blackbox:
      enabled: true
      port: 8080
      scheme: http
      module: http_2xx

  it-tools:
    name: IT-Tools
    category: Utilities
    tier: internal
    url: https://it-tools.home.arpa
    icon: it-tools.png

    homepage:
      enabled: true
      description: Collection of useful developer tools

    traefik:
      enabled: true
      port: 8080

    uptime:
      enabled: true

    # No native /metrics — it's a static tools page. Covered by
    # blackbox_exporter instead, see services/blackbox-exporter/README.md.
    blackbox:
      enabled: true
      port: 8080
      scheme: http
      module: http_2xx

  n8n:
    name: n8n
    category: Automation
    tier: internal  # exposed only via VPN/reverse proxy, see services/n8n
    url: https://n8n.home.arpa
    icon: n8n.png

    homepage:
      enabled: true
      description: Workflow automation platform

    traefik:
      enabled: true
      port: 5678

    uptime:
      enabled: true

    # No native Prometheus endpoint wired up here (n8n has an optional
    # N8N_METRICS flag worth checking against current docs — not enabled
    # in services/n8n/compose.yml). Covered by blackbox_exporter for now,
    # see services/blackbox-exporter/README.md.
    blackbox:
      enabled: true
      port: 5678
      scheme: http
      module: http_2xx

  obsidian:
    name: Obsidian
    category: Productivity
    tier: internal  # second-brain vault, AI-agent access only
    url: https://obsidian.home.arpa
    icon: obsidian.png

    homepage:
      enabled: false  # MCP/API only, no web UI, see services/obsidian
      description: Second-brain vault exposed to AI agents via MCP

    traefik:
      enabled: true
      port: 4000

    uptime:
      enabled: true  # TCP monitor on :4000, HTTP 2xx isn't reliable here

  jellyfin:
    name: Jellyfin
    category: Media
    # LAN via Traefik; also on jellyfin.jsisques.net via Cloudflare
    # Tunnel for remote access, see services/cloudflared/config.yml
    tier: internal
    url: https://jellyfin.home.arpa
    icon: jellyfin.png

    homepage:
      enabled: true
      description: Media streaming server

    traefik:
      enabled: true
      port: 8096

    uptime:
      enabled: true

    # No native /metrics — Jellyfin has no built-in Prometheus support.
    # Probed by blackbox_exporter instead, see
    # services/blackbox-exporter/README.md.
    blackbox:
      enabled: true
      port: 8096
      scheme: http
      module: http_2xx

  qbittorrent:
    name: qBittorrent
    category: Downloads
    # Torrent client, network_mode: service:gluetun in compose.yaml so all
    # its traffic (not the WebUI, just torrent traffic) routes through the
    # VPN. WebUI itself is published on the host like any other service.
    tier: internal
    url: https://qbittorrent.home.arpa
    icon: qbittorrent.png

    homepage:
      enabled: true
      description: Torrent client (via VPN)

    traefik:
      enabled: true
      port: 8080

    uptime:
      enabled: true

    # No native /metrics. Probed by blackbox_exporter instead, see
    # services/blackbox-exporter/README.md.
    blackbox:
      enabled: true
      port: 8080
      scheme: http
      module: http_2xx

  prowlarr:
    name: Prowlarr
    category: Downloads
    tier: internal
    url: https://prowlarr.home.arpa
    icon: prowlarr.png

    homepage:
      enabled: true
      description: Indexer manager for Sonarr/Radarr

    traefik:
      enabled: true
      port: 9696

    uptime:
      enabled: true

    blackbox:
      enabled: true
      port: 9696
      scheme: http
      module: http_2xx

  sonarr:
    name: Sonarr
    category: Downloads
    tier: internal
    url: https://sonarr.home.arpa
    icon: sonarr.png

    homepage:
      enabled: true
      description: TV series automation

    traefik:
      enabled: true
      port: 8989

    uptime:
      enabled: true

    blackbox:
      enabled: true
      port: 8989
      scheme: http
      module: http_2xx

  radarr:
    name: Radarr
    category: Downloads
    tier: internal
    url: https://radarr.home.arpa
    icon: radarr.png

    homepage:
      enabled: true
      description: Movie automation

    traefik:
      enabled: true
      port: 7878

    uptime:
      enabled: true

    blackbox:
      enabled: true
      port: 7878
      scheme: http
      module: http_2xx

  pyload:
    name: pyLoad
    category: Downloads
    # Paste a direct HTTP/FTP link, it downloads straight to the NAS —
    # the generic "give it a URL" downloader that isn't a torrent or a
    # video site.
    tier: internal
    url: https://pyload.home.arpa
    icon: pyload.png

    homepage:
      enabled: true
      description: Direct HTTP/FTP link downloader

    traefik:
      enabled: true
      port: 8000

    uptime:
      enabled: true

    blackbox:
      enabled: true
      port: 8000
      scheme: http
      module: http_2xx

  metube:
    name: MeTube
    category: Downloads
    # yt-dlp web UI: paste a YouTube (or any yt-dlp-supported site) URL,
    # it downloads the video/audio straight to the NAS.
    tier: internal
    url: https://metube.home.arpa
    icon: metube.png

    homepage:
      enabled: true
      description: YouTube/video downloader (yt-dlp)

    traefik:
      enabled: true
      port: 8081

    uptime:
      enabled: true

    blackbox:
      enabled: true
      port: 8081
      scheme: http
      module: http_2xx

  pbs:
    name: Proxmox Backup Server
    category: Infrastructure
    tier: internal
    # Not yet in Homepage/Traefik/Uptime Kuma — this is a minimal catalog
    # entry that exists only so pbs can opt into blackbox_exporter probing.
    # The host itself (address, sizing) lives in config/hosts.yaml; the
    # "pbs" key here matches that host key directly, no role fallback
    # needed. Self-signed TLS, hence the *_insecure module.

    # No native /metrics — PBS has no Prometheus support. Probed by
    # blackbox_exporter instead, see services/blackbox-exporter/README.md.
    blackbox:
      enabled: true
      port: 8007
      scheme: https
      module: http_2xx_insecure

  k3s-server:
    name: K3s API Server
    category: Infrastructure
    tier: internal
    # Same rationale as pbs above: minimal catalog entry only for
    # blackbox_exporter, matching the "k3s-server" host key in
    # config/hosts.yaml directly. The apiserver returns 401/403
    # unauthenticated, which the *_insecure module still counts as "up".

    # No native /metrics scraped here — the K3s apiserver isn't covered by
    # a `monitoring:` block yet. Probed by blackbox_exporter instead, see
    # services/blackbox-exporter/README.md.
    blackbox:
      enabled: true
      port: 6443
      scheme: https
      module: http_2xx_insecure
