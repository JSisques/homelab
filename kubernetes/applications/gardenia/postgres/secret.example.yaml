# Template only — not applied by kustomization.yaml and not referenced by
# any Application. Copy to secret.yaml (gitignored, see .gitignore) with
# real values, then apply once manually:
#
#   KUBECONFIG=~/.kube/homelab-k3s.yaml kubectl apply -f secret.yaml
#
# Equivalent one-liner instead of editing a file:
#
#   KUBECONFIG=~/.kube/homelab-k3s.yaml kubectl create secret generic gardenia-postgres-credentials \
#     -n gardenia \
#     --from-literal=POSTGRES_USER=gardenia \
#     --from-literal=POSTGRES_PASSWORD='<generate a strong password>'
apiVersion: v1
kind: Secret
metadata:
  name: gardenia-postgres-credentials
  namespace: gardenia
type: Opaque
stringData:
  POSTGRES_USER: gardenia
  POSTGRES_PASSWORD: CHANGE_ME
