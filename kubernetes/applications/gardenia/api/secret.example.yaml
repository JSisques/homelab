# Template only — not applied by kustomization.yaml and not referenced by
# any Application. Copy to secret.yaml (gitignored) with real values, then
# apply once manually:
#
#   KUBECONFIG=~/.kube/homelab-k3s.yaml kubectl apply -f secret.yaml
#
# Equivalent one-liner instead of editing a file (generate JWT_SECRET /
# OAUTH_STATE_SECRET with e.g. `openssl rand -base64 48`, and
# OAUTH_TOKEN_ENC_KEY specifically with `openssl rand -base64 32` — it must
# decode to exactly 32 bytes, see src/core/config/env.validation.ts):
#
#   KUBECONFIG=~/.kube/homelab-k3s.yaml kubectl create secret generic gardenia-api-secrets \
#     -n gardenia \
#     --from-literal=DATABASE_USERNAME=gardenia \
#     --from-literal=DATABASE_PASSWORD='<same value as postgres/secret.yaml POSTGRES_PASSWORD>' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=OAUTH_TOKEN_ENC_KEY="$(openssl rand -base64 32)" \
#     --from-literal=OAUTH_STATE_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=PLANTNET_API_KEY='<key from my.plantnet.org>'
apiVersion: v1
kind: Secret
metadata:
  name: gardenia-api-secrets
  namespace: gardenia
type: Opaque
stringData:
  DATABASE_USERNAME: gardenia
  DATABASE_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME_32_CHARS_MINIMUM
  OAUTH_TOKEN_ENC_KEY: CHANGE_ME_32_BYTE_BASE64_KEY
  OAUTH_STATE_SECRET: CHANGE_ME_32_CHARS_MINIMUM
  PLANTNET_API_KEY: CHANGE_ME
