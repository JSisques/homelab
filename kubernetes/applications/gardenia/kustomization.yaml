apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gardenia

resources:
  - namespace.yaml
  - postgres/pv.yaml
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - api/configmap.yaml
  - api/deployment.yaml
  - api/service.yaml
  - web/deployment.yaml
  - web/service.yaml
  - ingress.yaml

# secret.example.yaml files under postgres/ and api/ are intentionally not
# listed here — they're templates only. Copy each to secret.yaml (gitignored)
# with real values and `kubectl apply -f` it once, out of band. See README.md.
