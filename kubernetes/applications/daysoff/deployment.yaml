apiVersion: apps/v1
kind: Deployment
metadata:
  name: daysoff
  namespace: daysoff
  labels:
    app.kubernetes.io/name: daysoff
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: daysoff

  template:
    metadata:
      labels:
        app.kubernetes.io/name: daysoff
    spec:
      containers:
        - name: daysoff
          image: sisqueslabs/daysoff:latest
          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /healthz
              port: http

          livenessProbe:
            httpGet:
              path: /healthz
              port: http

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
