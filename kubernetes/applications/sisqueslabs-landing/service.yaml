apiVersion: v1
kind: Service
metadata:
  name: sisqueslabs-landing
  namespace: sisqueslabs-landing
  labels:
    app.kubernetes.io/name: sisqueslabs-landing
    app.kubernetes.io/part-of: homelab
spec:
  # NodePort rather than ClusterIP: there's no ingress controller running
  # in-cluster yet, so this is what the Cloudflare Tunnel LXC (see
  # services/cloudflared/config.yml) can actually reach on the LAN, same as
  # every other public/personal-tier service in this homelab.
  type: NodePort
  selector:
    app.kubernetes.io/name: sisqueslabs-landing
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
