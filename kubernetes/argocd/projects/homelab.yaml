apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
spec:
  description: >-
    Homelab infrastructure and applications, deployed from this
    repository only.

  sourceRepos:
    - https://github.com/JSisques/homelab.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
