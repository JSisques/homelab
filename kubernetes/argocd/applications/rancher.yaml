# See kubernetes/infrastructure/rancher/kustomization.yaml for what's
# actually deployed and why it's wrapped in Kustomize instead of a plain
# Helm source.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher
  namespace: argocd
spec:
  project: homelab

  source:
    repoURL: https://github.com/JSisques/homelab.git
    targetRevision: main
    path: kubernetes/infrastructure/rancher

  destination:
    server: https://kubernetes.default.svc
    namespace: cattle-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
