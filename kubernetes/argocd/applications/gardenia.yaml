# Prerequisites before this actually reconciles cleanly (see
# kubernetes/applications/gardenia/README.md for the full checklist):
# - ansible-playbook -i inventory/hosts.yml playbooks/gardenia.yaml has run
#   on k3s-server, so /mnt/nas/gardenia-postgres exists (postgres/pv.yaml
#   depends on it).
# - kubernetes/applications/gardenia/postgres/secret.yaml and api/secret.yaml
#   have been applied manually (see their .example templates) — Argo CD
#   does not manage secrets in this repo yet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gardenia
  namespace: argocd
spec:
  project: homelab

  source:
    repoURL: https://github.com/JSisques/homelab.git
    targetRevision: main
    path: kubernetes/applications/gardenia

  destination:
    server: https://kubernetes.default.svc
    namespace: gardenia

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
