# NOT ready to apply yet:
# - kubernetes/infrastructure/kafka/kustomization.yaml doesn't include
#   strimzi/kustomization.yaml, so the Strimzi CRDs/operator this Application
#   depends on are never installed — applying this as-is will fail.
# - node-pool.yaml requests 3 replicas at 1-2 CPU / 2-4 GiB each, more than
#   the current single-node k3s-server should take on. Needs K3s workers
#   first (see ansible/roles/k3s/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
spec:
  project: homelab

  source:
    repoURL: https://github.com/JSisques/homelab.git
    targetRevision: main
    path: kubernetes/infrastructure/kafka

  destination:
    server: https://kubernetes.default.svc
    namespace: kafka

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
