apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: daysoff
  namespace: argocd
spec:
  project: homelab

  source:
    repoURL: https://github.com/JSisques/homelab.git
    targetRevision: main
    path: kubernetes/applications/daysoff

  destination:
    server: https://kubernetes.default.svc
    namespace: daysoff

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
