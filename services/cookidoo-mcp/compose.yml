services:
  cookidoo-mcp:
    image: sisqueslabs/cookidoo-mcp:latest
    # Own image, re-tagged on every release — always re-pull on deploy
    # instead of reusing whatever :latest happened to resolve to last
    # time (see AGENTS.md#self-built-images-own-tools).
    pull_policy: always
    container_name: cookidoo-mcp
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      - PORT=3000
      - COOKIDOO_EMAIL=${COOKIDOO_EMAIL}
      - COOKIDOO_PASSWORD=${COOKIDOO_PASSWORD}

      - COOKIDOO_COUNTRY_CODE=es
      - COOKIDOO_LANGUAGE=es-ES
      - COOKIDOO_URL=https://cookidoo.es/foundation/es-ES
      - COOKIDOO_COOKIE_FILE=/data/session.json

      - OTEL_EXPORTER_OTLP_ENDPOINT=http://192.168.0.209:4318
      - OTEL_SERVICE_NAME=cookidoo-mcp

      - LOG_LEVEL=info

    volumes:
      - cookidoo-mcp-data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cookidoo-mcp-data:
