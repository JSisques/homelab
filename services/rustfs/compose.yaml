services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      # Single-volume mode: the NAS export is already the source of
      # truth, so the erasure-coded multi-volume layout RustFS defaults
      # to (its own docker-compose.yml uses
      # RUSTFS_VOLUMES=/data/rustfs{0..3}) would just split one NFS
      # mount into four subdirectories with no real durability gain.
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}

    volumes:
      - /mnt/nas/rustfs:/data
      - rustfs-logs:/logs

volumes:
  rustfs-logs:
