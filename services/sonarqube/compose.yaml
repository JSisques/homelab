services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped

    ports:
      - "9000:9000"

    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SONAR_JDBC_USERNAME=${POSTGRES_USER}
      - SONAR_JDBC_PASSWORD=${POSTGRES_PASSWORD}

    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

    # SonarQube bundles Elasticsearch, which refuses to start under the
    # default process limits. ulimits are container-scoped and safe to set
    # here; vm.max_map_count is a host-wide kernel setting and is NOT
    # namespaced, so it can't be set via compose `sysctls:` — it's applied
    # on the LXC host instead, see ansible/roles/sonarqube/tasks/main.yaml.
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: sonarqube-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  postgres-data:
