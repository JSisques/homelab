# lazymc proxies the public port and starts/stops the "mc" container on
# demand (see lazymc.* labels below) — it needs its own bridge network
# with static IPs (a lazymc-docker-proxy requirement, IPs must not
# change) and the Docker socket to control the "mc" container's
# lifecycle. See README.md.
networks:
  minecraft:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  lazymc:
    image: ghcr.io/joesturge/lazymc-docker-proxy:latest
    container_name: lazymc
    restart: unless-stopped

    networks:
      minecraft:
        ipv4_address: 172.20.0.2

    volumes:
      - /mnt/nas/minecraft:/server:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    ports:
      - "25565:25565"

  mc:
    image: itzg/minecraft-server:java25
    container_name: minecraft-paper
    # Managed entirely by lazymc (start/stop via the Docker socket
    # above) — restart: unless-stopped would fight it every time it
    # stops the container to sleep.
    restart: "no"
    tty: true
    stdin_open: true

    networks:
      minecraft:
        ipv4_address: 172.20.0.3

    labels:
      - lazymc.enabled=true
      - lazymc.group=mc
      - lazymc.server.address=mc:25565
      - lazymc.time.sleep_after=600

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      MEMORY: "6G"
      RCON_PASSWORD: ${MINECRAFT_RCON_PASSWORD}
      # Plugins auto-downloaded on startup — itzg/minecraft-server resolves
      # the latest release compatible with the server's Minecraft version.
      # Add/remove slugs here (see https://modrinth.com/plugin/<slug>), no
      # separate step needed. Vault isn't on Modrinth, so it's fetched via
      # PLUGINS from its GitHub release instead.
      #
      # Every slug is marked optional (trailing `?`) — without it, a
      # single plugin with no build yet for the server's Minecraft
      # version (happened with EssentialsX on 26.2) makes mc-image-helper
      # fail hard and the whole container refuses to start, taking down
      # every other plugin with it. Optional: missing/incompatible ones
      # just log a warning and startup continues.
      MODRINTH_PROJECTS: "luckperms?,essentialsx?,coreprotect?,griefprevention?,spark?,chunky?,placeholderapi?"
      PLUGINS: "https://github.com/MilkBowl/Vault/releases/latest/download/Vault.jar"

    volumes:
      - /mnt/nas/minecraft:/data

  mc-exporter:
    image: ghcr.io/dirien/minecraft-exporter:latest
    container_name: minecraft-exporter
    restart: unless-stopped

    # Explicit IP, not just attached to the network — otherwise Docker's
    # auto-assignment can grab .2 (reserved for lazymc below) depending
    # on container start order, and lazymc fails with "address already
    # in use".
    networks:
      minecraft:
        ipv4_address: 172.20.0.4

    environment:
      MC_RCON_ADDRESS: "mc:25575"
      MC_RCON_PASSWORD: ${MINECRAFT_RCON_PASSWORD}
      MC_WORLD: /minecraft/world
      MC_MOD_SERVER_STATS: papermc

    volumes:
      - /mnt/nas/minecraft:/minecraft:ro

    ports:
      - "9150:9150"
