tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # sisqueslabs.com — public homelab apps
  - hostname: gardenia.sisqueslabs.com
    service: http://gardenia.home.arpa:3000
  # Kubernetes-hosted (see kubernetes/applications/), no in-cluster ingress
  # yet, so these forward straight to the k3s-server node's NodePort.
  - hostname: landing.sisqueslabs.com
    service: http://192.168.1.31:30080
  - hostname: daysoff.sisqueslabs.com
    service: http://192.168.1.31:30081

  # jsisques.net — personal apps (add entries here as they're deployed)
  - hostname: portfolio.jsisques.net
    service: http://portfolio-web.home.arpa:8080
  - hostname: jellyfin.jsisques.net
    service: http://jellyfin.home.arpa:8096
  # SonarQube CI analysis, reached from GitHub Actions (this repo and other
  # personal repos) — see services/sonarqube/README.md.
  - hostname: sonarqube.jsisques.net
    service: http://sonarqube.home.arpa:9000
  # - hostname: <app>.jsisques.net
  #   service: http://<internal-target>

  # Anything not matched above is refused rather than silently routed.
  - service: http_status:404
