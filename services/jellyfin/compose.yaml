services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped

    ports:
      - "8096:8096"

    # Intel UHD 630 iGPU on the proxmox host, passed through to the LXC
    # via `pct set -dev0/-dev1` (see README#gpu-passthrough). Requires
    # /dev/dri to exist on whatever's running this compose file — see
    # "Local Development" below if it doesn't.
    devices:
      - /dev/dri:/dev/dri

    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - /mnt/nas/jellyfin/movies:/media/movies:ro
      - /mnt/nas/jellyfin/series:/media/series:ro

volumes:
  jellyfin-config:
  jellyfin-cache:
