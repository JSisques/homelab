services:
  # VPN gateway for qBittorrent only. Nothing else in this stack routes
  # through it — Prowlarr/Sonarr/Radarr/pyLoad/MeTube talk to trackers,
  # indexers and hosters directly, same as any other homelab service.
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: downloads-gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    ports:
      - "8080:8080" # qBittorrent WebUI
      - "6881:6881" # qBittorrent torrent port (TCP)
      - "6881:6881/udp"

    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - TZ=${TZ}

    volumes:
      - gluetun-config:/gluetun

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    # Shares gluetun's network namespace: no ports/network of its own,
    # all its traffic (and only its traffic) goes through the VPN.
    network_mode: service:gluetun
    depends_on:
      - gluetun

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080

    volumes:
      - qbittorrent-config:/config
      - /mnt/nas/downloads/torrents:/downloads

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped

    ports:
      - "9696:9696"

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - prowlarr-config:/config

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped

    ports:
      - "8989:8989"

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - sonarr-config:/config
      - /mnt/nas/downloads/torrents:/downloads
      - /mnt/nas/multimedia/series:/tv

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped

    ports:
      - "7878:7878"

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - radarr-config:/config
      - /mnt/nas/downloads/torrents:/downloads
      - /mnt/nas/multimedia/peliculas:/movies

  # Generic "paste a direct HTTP/FTP link" downloader — the non-torrent,
  # non-video-site case.
  pyload:
    image: lscr.io/linuxserver/pyload:latest
    container_name: pyload
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

    volumes:
      - pyload-config:/config
      - /mnt/nas/downloads/direct:/downloads

  # "Paste a YouTube (or any yt-dlp-supported site) link" downloader.
  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      - UID=${PUID}
      - GID=${PGID}

    volumes:
      - /mnt/nas/downloads/youtube:/downloads

volumes:
  gluetun-config:
  qbittorrent-config:
  prowlarr-config:
  sonarr-config:
  radarr-config:
  pyload-config:
