services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - SERVERURL=vpn.jsisques.net  # REPLACE_WITH_REAL_ENDPOINT — see README
      - SERVERPORT=51820
      - PEERS=5
      # PEERDNS/ALLOWEDIPS come from .env, rendered by the Ansible role
      # (ansible/roles/wireguard/templates/env.j2) from the Ansible
      # inventory's lan_cidr/adguard-home address — both ultimately
      # derived from config/hosts.yaml's `network:` block, so a LAN
      # subnet change doesn't leave the VPN routing clients into the old
      # one. See README.md.
      - PEERDNS=${PEERDNS}
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=${ALLOWEDIPS}

    ports:
      - "51820:51820/udp"

    volumes:
      - wireguard-config:/config
      - /lib/modules:/lib/modules:ro

    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

volumes:
  wireguard-config:
