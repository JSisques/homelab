services:
  soulfire:
    image: ghcr.io/soulfiremc-com/soulfire:latest
    container_name: soulfire
    restart: unless-stopped
    # Needed to `docker compose attach soulfire` into the interactive
    # console and run `generate-token api` — the GUI/CLI client can't
    # connect without a token (see services/soulfire/README.md).
    stdin_open: true
    tty: true

    ports:
      - "38765:38765"

    volumes:
      - soulfire-data:/soulfire/data

volumes:
  soulfire-data:
