services:
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped

    ports:
      - "9115:9115"

    volumes:
      - ./config.yml:/etc/blackbox_exporter/config.yml:ro

networks:
  default:
    name: monitoring
    external: true
