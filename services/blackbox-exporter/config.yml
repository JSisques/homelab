modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []  # any 2xx
      method: GET

  # For self-signed backends (PBS, the K3s apiserver) — same as http_2xx
  # but doesn't fail the probe on an untrusted certificate, and accepts
  # any status code (the K3s apiserver returns 401/403 unauthenticated,
  # which still proves it's up).
  http_2xx_insecure:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []
      method: GET
      tls_config:
        insecure_skip_verify: true

  tcp_connect:
    prober: tcp
    timeout: 5s

  # For services whose HTTP 200 doesn't mean "actually up" (e.g. SonarQube
  # returns 200 on /api/system/status while still STARTING) — same as
  # http_2xx but also fails the probe unless the response body contains
  # "status":"UP".
  http_status_up:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []  # any 2xx
      method: GET
      fail_if_body_not_matches_regexp:
        - '"status":"UP"'
