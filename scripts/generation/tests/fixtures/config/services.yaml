services:
  app:
    name: App
    category: Applications
    tier: internal
    url: http://10.10.10.50:8080
    icon: mdi-app

    homepage:
      enabled: true
      description: Internal test app

    monitoring:
      enabled: true
      type: prometheus
      endpoint: http://10.10.10.50:8080/metrics

  vm-app:
    name: VM App
    category: Applications
    tier: personal
    url: https://vmapp.jsisques.net
    icon: mdi-vm

    homepage:
      enabled: true
      description: VM-hosted personal app

    traefik:
      enabled: true
      port: 9000

    blackbox:
      enabled: true
      port: 9000
      scheme: http
      module: http_2xx

  public-app:
    name: Public App
    category: Applications
    tier: public
    url: https://pubapp.sisqueslabs.com
    icon: mdi-earth

    homepage:
      enabled: true
      description: Public app

    traefik:
      enabled: true
      port: 8081

  traefik:
    name: Traefik
    category: Infrastructure
    tier: internal
    url: http://10.10.10.70:8080
    icon: traefik.png

    homepage:
      enabled: true
      description: Reverse proxy
