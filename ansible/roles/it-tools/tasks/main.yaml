---
- name: Create IT-Tools application directory
  ansible.builtin.file:
    path: "{{ it_tools_app_dir }}"
    state: directory
    mode: "0755"

- name: Deploy IT-Tools Docker Compose file
  ansible.builtin.copy:
    src: "{{ services_dir }}/it-tools/compose.yaml"
    dest: "{{ it_tools_app_dir }}/compose.yaml"
    mode: "0644"

- name: Start IT-Tools
  community.docker.docker_compose_v2:
    project_src: "{{ it_tools_app_dir }}"
    state: present
