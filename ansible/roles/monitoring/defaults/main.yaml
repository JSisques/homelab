---
monitoring_docker_network: monitoring

monitoring_prometheus_app_dir: /opt/prometheus
monitoring_grafana_app_dir: /opt/grafana
monitoring_loki_app_dir: /opt/loki
monitoring_alertmanager_app_dir: /opt/alertmanager
monitoring_blackbox_app_dir: /opt/blackbox-exporter

# Telegram receiver for Alertmanager. Without these, alerts still fire but
# land in a "null" receiver instead of Telegram. Override via Ansible Vault
# or CI secrets — never commit real values.
monitoring_alertmanager_telegram_bot_token: ""
monitoring_alertmanager_telegram_chat_id: 0
