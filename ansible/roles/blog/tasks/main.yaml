---
- name: Create Blog application directory
  ansible.builtin.file:
    path: "{{ blog_app_dir }}"
    state: directory
    mode: "0755"

- name: Deploy Blog Docker Compose file
  ansible.builtin.copy:
    src: "{{ services_dir }}/blog/compose.yaml"
    dest: "{{ blog_app_dir }}/compose.yaml"
    mode: "0644"

- name: Start Blog
  community.docker.docker_compose_v2:
    project_src: "{{ blog_app_dir }}"
    state: present
