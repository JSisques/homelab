---
- name: Install NFS client utilities
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create NFS mount points for the media libraries
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ jellyfin_media_mount_path }}/peliculas"
    - "{{ jellyfin_media_mount_path }}/series"

- name: Mount the NAS NFS export (peliculas)
  ansible.posix.mount:
    path: "{{ jellyfin_media_mount_path }}/peliculas"
    src: "{{ jellyfin_nas_export_peliculas }}"
    fstype: nfs
    opts: ro,sync,hard,intr
    state: mounted

- name: Mount the NAS NFS export (series)
  ansible.posix.mount:
    path: "{{ jellyfin_media_mount_path }}/series"
    src: "{{ jellyfin_nas_export_series }}"
    fstype: nfs
    opts: ro,sync,hard,intr
    state: mounted

- name: Create Jellyfin application directory
  ansible.builtin.file:
    path: "{{ jellyfin_app_dir }}"
    state: directory
    mode: "0755"

- name: Deploy Jellyfin Docker Compose file
  ansible.builtin.copy:
    src: "{{ services_dir }}/jellyfin/compose.yaml"
    dest: "{{ jellyfin_app_dir }}/compose.yaml"
    mode: "0644"

- name: Start Jellyfin
  community.docker.docker_compose_v2:
    project_src: "{{ jellyfin_app_dir }}"
    state: present
