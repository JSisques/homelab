---
minecraft_app_dir: /opt/minecraft

# World data at /mnt/nas/minecraft comes from a Proxmox-level bind mount
# (host mounts the NAS CIFS share, LXC gets it as `mp0`), not something
# this role manages — unprivileged LXCs can't mount CIFS/NFS themselves
# even with the `mount=cifs;nfs` feature flag (kernel limitation, not
# just permissions). See services/minecraft/README.md.

# RCON password — used by the Prometheus exporter to query TPS/player
# stats, and for admin console access (`docker exec mc rcon-cli`).
# lazymc-docker-proxy itself does not use RCON; it stops the server
# container with SIGTERM. The role fails loudly if this is empty.
minecraft_rcon_password: ""
