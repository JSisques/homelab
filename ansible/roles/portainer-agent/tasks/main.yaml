---
- name: Create Portainer Agent application directory
  ansible.builtin.file:
    path: "{{ portainer_agent_app_dir }}"
    state: directory
    mode: "0755"

- name: Deploy Portainer Agent Docker Compose file
  ansible.builtin.copy:
    src: "{{ services_dir }}/portainer-agent/compose.yaml"
    dest: "{{ portainer_agent_app_dir }}/compose.yaml"
    mode: "0644"

- name: Start Portainer Agent
  community.docker.docker_compose_v2:
    project_src: "{{ portainer_agent_app_dir }}"
    state: present
