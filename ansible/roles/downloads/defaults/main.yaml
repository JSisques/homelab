---
downloads_app_dir: /opt/downloads

# /mnt/nas/downloads and /mnt/nas/jellyfin (Sonarr/Radarr write into the
# same folder Jellyfin reads read-only) both come from Proxmox-level
# bind mounts — unprivileged LXCs can't mount CIFS/NFS themselves even
# with the `mount=cifs;nfs` feature flag (kernel limitation, not just
# permissions). Same pattern as ansible/roles/minecraft/,
# ansible/roles/rustfs/, and ansible/roles/jellyfin/. This role does
# bind the mounts (`pct set`, below) but does not create the underlying
# CIFS mounts on the Proxmox host itself — see
# services/downloads/README.md for that one-time setup.
downloads_mount_path: /mnt/nas/downloads
downloads_jellyfin_mount_path: /mnt/nas/jellyfin

# Where those two NAS shares are already mounted on the Proxmox host
# (systemd .mount units, set up once per services/downloads/README.md).
downloads_nas_source_path: /mnt/pve/downloads
downloads_jellyfin_nas_source_path: /mnt/pve/jellyfin

# Proxmox VMID for the downloads LXC. Defaults to its octet
# (config/hosts.yaml) like every other LXC in this repo — see
# config/README.md. `pct set -mpN` needs `root@pam` on the Proxmox API
# token, which this repo's token deliberately doesn't have, so this is
# done via Ansible (SSH to the `proxmox` host) instead of Terraform.
downloads_lxc_vmid: 216

# linuxserver.io images run as this UID/GID and chown their volumes
# accordingly — must match the uid/gid the host-side CIFS mounts use.
downloads_puid: 1000
downloads_pgid: 1000
downloads_timezone: Europe/Madrid

# VPN (gluetun, in front of qBittorrent only). Must be overridden via
# Ansible Vault or CI secrets (see Makefile's ANSIBLE_EXTRA_VARS). Never
# commit real values.
# Provider identifiers: https://github.com/qdm12/gluetun/wiki
downloads_vpn_service_provider: changeme
downloads_vpn_wireguard_private_key: changeme
downloads_vpn_wireguard_addresses: changeme
# Optional: narrow the VPN server selection, e.g. "Netherlands,Sweden".
# Leave empty to let gluetun pick.
downloads_vpn_server_countries: ""

# qBittorrent's WebUI has no env var for this (linuxserver/docker-qbittorrent
# #228, closed as not planned) — it generates a random temporary password on
# every container start until you change it through the WebUI once. Set here
# and the role does that first login + change via the WebUI API so it's
# permanent from the first deploy. Must be overridden (see Makefile's
# ANSIBLE_EXTRA_VARS). Never commit real values.
downloads_qbittorrent_username: changeme
downloads_qbittorrent_password: changeme

# qBittorrent has no schedule-based pause/resume in its API — only the
# Alternative Speed Limits scheduler (Settings -> Speed -> Scheduling
# in the WebUI). So "downloads only at night" means: full/unlimited
# speed during the night window below, throttled to
# downloads_qbittorrent_throttle_speed_kib the rest of the day. 0 would
# mean "unlimited" to qBittorrent, not "paused", hence a small non-zero
# value instead of an actual pause.
downloads_qbittorrent_scheduler_enabled: true
# Throttled (alt speed limit) window: 08:00-23:00, i.e. normal speed
# 23:00-08:00.
downloads_qbittorrent_throttle_from_hour: 8
downloads_qbittorrent_throttle_from_minute: 0
downloads_qbittorrent_throttle_to_hour: 23
downloads_qbittorrent_throttle_to_minute: 0
# 0 = every day. qBittorrent's other values: 1=every weekday,
# 2=every weekend, 3=every Monday, 4=every Tuesday, ... 9=every Sunday.
downloads_qbittorrent_throttle_days: 0
downloads_qbittorrent_throttle_speed_kib: 1
