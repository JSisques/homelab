---
- name: Create download library subdirectories
  ansible.builtin.file:
    path: "{{ downloads_mount_path }}/{{ item }}"
    state: directory
    mode: "0775"
    owner: "{{ downloads_puid }}"
    group: "{{ downloads_pgid }}"
  loop:
    - torrents
    - direct
    - youtube

- name: Create downloads application directory
  ansible.builtin.file:
    path: "{{ downloads_app_dir }}"
    state: directory
    mode: "0755"

- name: Deploy downloads environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ downloads_app_dir }}/.env"
    mode: "0600"

- name: Deploy downloads Docker Compose file
  ansible.builtin.copy:
    src: "{{ services_dir }}/downloads/compose.yaml"
    dest: "{{ downloads_app_dir }}/compose.yaml"
    mode: "0644"

- name: Start the downloads stack
  community.docker.docker_compose_v2:
    project_src: "{{ downloads_app_dir }}"
    state: present
