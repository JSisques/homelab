---
- name: Create AdGuard Home Sync application directory
  ansible.builtin.file:
    path: "{{ adguard_home_sync_app_dir }}"
    state: directory
    mode: "0755"

- name: Deploy AdGuard Home Sync configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ adguard_home_sync_app_dir }}/config.yaml"
    mode: "0600"

- name: Deploy AdGuard Home Sync Docker Compose file
  ansible.builtin.copy:
    src: "{{ services_dir }}/adguard-home-sync/compose.yaml"
    dest: "{{ adguard_home_sync_app_dir }}/compose.yaml"
    mode: "0644"

- name: Start AdGuard Home Sync
  community.docker.docker_compose_v2:
    project_src: "{{ adguard_home_sync_app_dir }}"
    state: present
