---
- name: Create Sisques Labs Landing application directory
  ansible.builtin.file:
    path: "{{ sisqueslabs_landing_app_dir }}"
    state: directory
    mode: "0755"

- name: Deploy Sisques Labs Landing Docker Compose file
  ansible.builtin.copy:
    src: "{{ services_dir }}/sisqueslabs-landing/compose.yaml"
    dest: "{{ sisqueslabs_landing_app_dir }}/compose.yaml"
    mode: "0644"

- name: Start Sisques Labs Landing
  community.docker.docker_compose_v2:
    project_src: "{{ sisqueslabs_landing_app_dir }}"
    state: present
