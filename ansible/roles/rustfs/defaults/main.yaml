---
rustfs_app_dir: /opt/rustfs

# The IP resolves via hostvars from the "nas" host in config/hosts.yaml —
# it updates automatically if that host's address ever changes. Adjust
# the export path here if the NAS's folder layout changes.
rustfs_nas_export: "{{ hostvars['nas'].ansible_host }}:/export/rustfs"
rustfs_data_mount_path: /mnt/nas/rustfs

# Root credentials for the S3 API / console. Must be provided via Ansible
# Vault or CI secrets — never commit real values. The role refuses to run
# without them (see tasks/main.yaml). Never fall back to RustFS's own
# defaults (rustfsadmin/rustfsadmin) — they're public.
rustfs_access_key: ""
rustfs_secret_key: ""
