---
obsidian_app_dir: /opt/obsidian

# The vault at /mnt/nas/obsidian comes from a Proxmox-level bind mount
# (host mounts the NAS CIFS share, LXC gets it as `mp0`), not something
# this role manages — unprivileged LXCs can't mount CIFS/NFS themselves
# even with the `mount=cifs;nfs` feature flag (kernel limitation, not
# just permissions). Same pattern as ansible/roles/minecraft/,
# ansible/roles/rustfs/, ansible/roles/jellyfin/, and
# ansible/roles/downloads/. See services/obsidian/README.md for the
# exact host-side setup commands.
