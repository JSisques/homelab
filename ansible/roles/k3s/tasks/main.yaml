---
- name: Check supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
    fail_msg: This role currently supports Debian-family operating systems only.

- name: Download the K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: Install K3s server
  ansible.builtin.command: /tmp/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_EXEC: "server --write-kubeconfig-mode 644"

- name: Wait for the K3s node to be Ready
  ansible.builtin.command: >-
    k3s kubectl wait --for=condition=Ready node --all
    --timeout={{ k3s_node_ready_timeout }}s
  changed_when: false

- name: Create the Argo CD namespace manifest
  ansible.builtin.copy:
    dest: /tmp/argocd-namespace.yaml
    mode: "0644"
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd

- name: Apply the Argo CD namespace
  ansible.builtin.command: k3s kubectl apply -f /tmp/argocd-namespace.yaml
  register: k3s_apply_ns
  changed_when: "'unchanged' not in k3s_apply_ns.stdout"

- name: Install Argo CD
  ansible.builtin.command: >-
    k3s kubectl apply --server-side --force-conflicts -n argocd -f {{ k3s_argocd_install_manifest }}
  # Client-side apply stores the whole manifest in a last-applied-configuration
  # annotation, which overflows the 256KiB annotation limit on Argo CD's
  # applicationsets.argoproj.io CRD. Server-side apply tracks field ownership
  # instead of that annotation, so it doesn't hit the limit.
  register: k3s_apply_argocd
  changed_when: "'unchanged' not in k3s_apply_argocd.stdout"

- name: Wait for the Argo CD server deployment to become available
  ansible.builtin.command: >-
    k3s kubectl -n argocd rollout status deployment/argocd-server --timeout=180s
  changed_when: false

- name: Fetch kubeconfig from the K3s server
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ k3s_kubeconfig_local_path | expanduser }}"
    flat: true

- name: Point the local kubeconfig copy at the real server address
  ansible.builtin.replace:
    path: "{{ k3s_kubeconfig_local_path | expanduser }}"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ ansible_host }}:6443"
  delegate_to: localhost
  become: false

- name: Show how to use the fetched kubeconfig
  ansible.builtin.debug:
    msg: >-
      kubeconfig saved to {{ k3s_kubeconfig_local_path }}. Use it with:
      export KUBECONFIG={{ k3s_kubeconfig_local_path }}
