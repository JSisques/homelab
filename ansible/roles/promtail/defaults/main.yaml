---
# The "monitoring" host in config/hosts.yaml — update this if that
# host's address ever changes.
promtail_loki_url: http://192.168.1.20:3100/loki/api/v1/push
promtail_config_path: /etc/promtail/config.yml

promtail_apt_keyring: /etc/apt/keyrings/grafana.gpg
promtail_apt_key_url: https://apt.grafana.com/gpg.key
promtail_apt_repository: >-
  deb [signed-by={{ promtail_apt_keyring }}] https://apt.grafana.com
  stable main
