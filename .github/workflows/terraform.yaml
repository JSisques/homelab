name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Plan
    # Proxmox only listens on the LAN, so this needs a runner that can
    # actually reach it — same runner as deploy.yaml.
    runs-on:
      - self-hosted
      - linux
      - homelab

    defaults:
      run:
        working-directory: terraform/proxmox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: pip install yq

      - name: Generate Terraform variables from config/hosts.yaml
        working-directory: .
        run: |
          chmod +x scripts/generation/generate-terraform-vars.sh
          ./scripts/generation/generate-terraform-vars.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
