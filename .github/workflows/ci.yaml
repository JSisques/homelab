name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  yaml:
    name: Validate YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .

  shell:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: find scripts -type f -name "*.sh" -print0 | xargs -0 -r shellcheck

  generation-tests:
    name: Test Generation Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq and bats
        run: |
          pip install yq
          sudo apt-get update && sudo apt-get install -y bats

      - name: Make scripts executable
        run: chmod +x scripts/generation/*.sh

      - name: Run bats tests
        run: bats scripts/generation/tests

  secrets:
    name: Scan for Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --redact -v

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/proxmox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  ansible:
    name: Validate Ansible
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible ansible-lint

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible Lint
        run: ansible-lint .

      - name: Test AdGuard Home seed config
        working-directory: .
        run: ./scripts/validation/test-adguard-home-config.sh

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose files
        shell: bash
        run: |
          set -e

          find services \( \
            -name "compose.yml" -o \
            -name "compose.yaml" -o \
            -name "docker-compose.yml" \
          \) |
          while read -r file; do
            echo "Validating $file"
            docker compose -f "$file" config --quiet
          done
